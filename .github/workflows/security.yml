name: DevSecOps CI/CD Security Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  # ============================================================================
  # JOB 1: FUNCTIONAL UNIT TESTING
  # ============================================================================
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Pytest Suite
        run: |
          pytest -v tests/

  # ============================================================================
  # JOB 2: MULTI-STAGE SECURITY SCANNING
  # NOTE: DEMO MODE is enabled by default (continue-on-error: true on scan steps)
  # to allow all tools to execute and display results without halting the pipeline.
  # To enable STRICT MODE: change continue-on-error to false.
  # ============================================================================
  security-scans:
    name: DevSecOps Security Scanners
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout Code with Git History
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Required for Gitleaks commit history scan

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Security Tools
        run: |
          python -m pip install --upgrade pip
          pip install bandit bandit-sarif-formatter pip-audit checkov

      - name: Create Reports Directory
        run: mkdir -p reports

      # ------------------------------------------------------------------------
      # SCANNER 1: BANDIT (Python Static Application Security Testing - SAST)
      # ------------------------------------------------------------------------
      - name: Run Bandit (SAST)
        id: bandit
        continue-on-error: true # DEMO MODE: Switch to false for STRICT MODE
        run: |
          echo "::group::Bandit SAST Execution"
          # Scan app.py, output human-readable and SARIF formats
          bandit -r app.py -f txt -o reports/bandit-report.txt || true
          bandit -r app.py -f sarif -o reports/bandit.sarif || true
          cat reports/bandit-report.txt
          echo "::endgroup::"

      # ------------------------------------------------------------------------
      # SCANNER 2: PIP-AUDIT (Software Composition Analysis - SCA)
      # ------------------------------------------------------------------------
      - name: Run pip-audit (SCA)
        id: pip_audit
        continue-on-error: true # DEMO MODE: Switch to false for STRICT MODE
        run: |
          echo "::group::pip-audit Dependency Scan"
          pip-audit -r requirements.txt -f json -o reports/pip-audit-report.json || true
          pip-audit -r requirements.txt || true
          echo "::endgroup::"

      # ------------------------------------------------------------------------
      # SCANNER 3: GITLEAKS (Secret Detection)
      # ------------------------------------------------------------------------
      - name: Run Gitleaks (Secret Scanning)
        uses: gitleaks/gitleaks-action@v2
        continue-on-error: true # DEMO MODE: Switch to false for STRICT MODE
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false
          GITLEAKS_ENABLE_SUMMARY: true

      # ------------------------------------------------------------------------
      # SCANNER 4: CHECKOV (Infrastructure as Code - IaC Security)
      # ------------------------------------------------------------------------
      - name: Run Checkov (IaC Scan)
        id: checkov
        continue-on-error: true # DEMO MODE: Switch to false for STRICT MODE
        run: |
          echo "::group::Checkov IaC Scan"
          checkov -d terraform/ --output cli --output sarif --output-file-path reports/ || true
          echo "::endgroup::"

      # ------------------------------------------------------------------------
      # SCANNER 5: TRIVY (Filesystem & Dockerfile Misconfiguration Scanner)
      # ------------------------------------------------------------------------
      - name: Run Trivy (Filesystem & Misconfig Scan)
        uses: aquasecurity/trivy-action@0.28.0
        continue-on-error: true # DEMO MODE: Switch to false for STRICT MODE
        with:
          scan-type: "fs"
          ignore-unfixed: false
          format: "sarif"
          output: "reports/trivy.sarif"
          severity: "CRITICAL,HIGH,MEDIUM"

      # ------------------------------------------------------------------------
      # ARTIFACT & SARIF UPLOADS
      # ------------------------------------------------------------------------
      - name: Upload Security Reports as Job Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: devsecops-security-reports
          path: reports/
          retention-days: 14

      - name: Upload Bandit SARIF to GitHub Security Tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        continue-on-error: true # Prevents failure if GHAS/SARIF upload is restricted
        with:
          sarif_file: reports/bandit.sarif
          category: bandit-sast

      - name: Upload Trivy SARIF to GitHub Security Tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        continue-on-error: true
        with:
          sarif_file: reports/trivy.sarif
          category: trivy-fs

  # ============================================================================
  # JOB 3: GITHUB CODEQL STATIC ANALYSIS
  # ============================================================================
  codeql:
    name: GitHub CodeQL Analysis
    runs-on: ubuntu-latest
    needs: test
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python
          config-file: ./.github/codeql/codeql-config.yml

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        continue-on-error: true # Demonstrates findings in public repos
